name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            libqt5opengl5-dev \
            qttools5-dev-tools \
            make \
            g++ \
            patchelf

      - name: Build Qt Live View
        run: bash build-demos.sh liveview

      - name: Package Qt Live View
        run: |
          cd build/liveview
          tar -czf ../../QtLiveView-linux64.tar.gz \
            QtLiveView \
            run.sh \
            lib/ \
            config/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QtLiveView-linux64.tar.gz
          generate_release_notes: true
