services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hikvision-dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:9015:8080"   # Open http://localhost:9015 in your browser

    volumes:
      # Mount entire SDK as read-write so builds output into the same tree
      - .:/workspace/sdk
      # Persist installed VS Code extensions across container restarts
      - code-server-extensions:/home/developer/.local/share/code-server

    environment:
      # ── Linker: finds bundled .so files (libhcnetsdk, libPlayCtrl, etc.)
      #    during `qmake && make` without needing -L flags in the .pro ─────────
      LIBRARY_PATH: /workspace/sdk/lib

      # ── Runtime loader: resolves bundled .so files when running the binary ──
      #    Includes the SDK's own libssl.so.1.1, libopenal.so.1, libz.so etc. ─
      LD_LIBRARY_PATH: /workspace/sdk/lib:/workspace/sdk/lib/HCNetSDKCom

      # ── Qt platform for headless / in-container execution ───────────────────
      #    Use 'offscreen' to run the compiled binary without a real display.
      #    Set to 'xcb' if you forward X11 from the host instead. ─────────────
      QT_QPA_PLATFORM: offscreen

      # ── Suppress Qt high-DPI warnings inside container ──────────────────────
      QT_LOGGING_RULES: "qt.qpa.*=false"

volumes:
  code-server-extensions:
